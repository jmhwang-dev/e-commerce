x-spark-common: &spark-common
  image: ghcr.io/jmhwang-dev/warehouse:sp3.5.6-ice1.9.1

services:
  spark-master-batch:
    <<: *spark-common
    container_name: spark-master-batch
    ports:
      - "${SPARK_MASTER_PORT}:${SPARK_MASTER_PORT}"
      - "${SPARK_MASTER_WEBUI_PORT:-8080}:${SPARK_MASTER_WEBUI_PORT:-8080}"
    environment:
      SPARK_LOCAL_IP: ${SPARK_LOCAL_IP}
      SPARK_MASTER_HOST: ${SPARK_MASTER_HOST}
      SPARK_MASTER_PORT: ${SPARK_MASTER_PORT}
      SPARK_NO_DAEMONIZE: ${SPARK_NO_DAEMONIZE}
      SPARK_MASTER_WEBUI_PORT: ${SPARK_MASTER_WEBUI_PORT:-8080}
    volumes:
      - ./configs/spark:/opt/spark/conf
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    depends_on:
      - spark-history

  spark-history:
    <<: *spark-common
    container_name: spark-history
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      SPARK_NO_DAEMONIZE: ${SPARK_NO_DAEMONIZE}
      SPARK_HISTORY_OPTS: "-Dspark.history.ui.port=18080"
    volumes:
      - ./configs/spark:/opt/spark/conf
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer

  init-spark:
    <<: *spark-common
    container_name: init-spark
    depends_on:
      - spark-master-batch
    environment:
      SPARK_MASTER_URL: "spark://${SPARK_MASTER_HOST}:${SPARK_MASTER_PORT}"
    volumes:
      - ./configs/spark:/opt/spark/conf
    entrypoint: >
      bash -c "
        echo 'Waiting for cluster stability...';
        sleep 10;
        echo 'Initializing Iceberg Namespace via S3 (MinIO)...';
        /opt/spark/bin/spark-sql \
        --master local[*] \
        -e \"CREATE NAMESPACE IF NOT EXISTS warehousedev.default;\"
      "